<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery with Hover Effects</title>
    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-title">
        <h1>Photo Portfolio</h1>
    </div>
    <div class="gallery-container">
        <div class="image-box">
            <img src="rose.jpg" alt="Nature">
            <div class="overlay"><span>View Detail</span></div>
        </div>
        <div class="image-box">
            <img src="passion flower.jpg" alt="City">
            <div class="overlay"><span>View Detail</span></div>
        </div>
        <div class="image-box">
            <img src="chrissanthmum.jpg" alt="Abstract">
            <div class="overlay"><span>View Detail</span></div>
        </div>
        <div class="image-box">
            <img src="lily.jpg" alt="Animals">
            <div class="overlay"><span>View Detail</span></div>
        </div>
    </div>
</body>
</html>
